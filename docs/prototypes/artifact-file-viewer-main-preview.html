<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Valuz Artifact Viewer Prototype - Main Area Preview</title>
    <style>
      :root {
        --bg: #f8f9fb;
        --surface: #ffffff;
        --surface-base: #f8f9fb;
        --surface-soft: #f7f8fa;
        --surface-2: #f5f5f4;
        --surface-muted: #f3f4f6;
        --ink: #131313;
        --ink-soft: #6e7481;
        --ink-muted: #b6b7bc;
        --line: #e6e7e9;
        --line-strong: #dbdbdb;
        --brand: #6d5cff;
        --brand-soft: #ede9ff;
        --green: #16a34a;
        --red: #dc2626;
        --code-bg: #f8f9fb;
        --code-ink: #131313;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        --radius: 8px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(ellipse at 45% 50%, #e0e1ea 0%, var(--bg) 100%);
        color: var(--ink);
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      .app {
        display: grid;
        grid-template-columns: 72px minmax(0, 1fr) 360px;
        height: 100vh;
        min-height: 760px;
      }

      .rail {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 14px 10px;
        border-right: 1px solid var(--line);
        background: transparent;
      }

      .brand {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 12px;
        background: linear-gradient(135deg, #533afd 0%, #965cf9 71.429%);
        color: var(--surface);
        font-size: 14px;
        font-weight: 760;
      }

      .rail-button {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--ink-soft);
        cursor: pointer;
      }

      .rail-button.active,
      .rail-button:hover {
        background: var(--surface-soft);
        color: var(--ink);
      }

      .main {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        min-height: 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 20px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }

      .crumb {
        color: var(--ink-muted);
        font-size: 12px;
      }

      .crumb strong {
        color: var(--ink);
        font-weight: 650;
      }

      .top-actions,
      .row-actions,
      .artifact-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .icon-button,
      .text-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        height: 30px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--ink-soft);
        cursor: pointer;
        font-size: 12px;
      }

      .icon-button {
        width: 32px;
      }

      .text-button {
        padding: 0 10px;
      }

      .icon-button:hover,
      .text-button:hover {
        border-color: var(--line-strong);
        color: var(--ink);
      }

      .icon-button:disabled {
        cursor: not-allowed;
        opacity: 0.44;
      }

      .workspace {
        min-height: 0;
        flex: 1;
        overflow: hidden;
        padding: 12px;
      }

      .project-home,
      .artifact {
        height: 100%;
        min-height: 640px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .project-home {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
      }

      .home-hero {
        padding: 28px 34px 22px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }

      .eyebrow {
        color: var(--ink-soft);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      .home-hero h1 {
        margin: 8px 0 8px;
        font-size: 24px;
        line-height: 1.25;
      }

      .home-hero p {
        max-width: 720px;
        color: var(--ink-soft);
        font-size: 14px;
        line-height: 1.65;
      }

      .home-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        padding: 22px 34px;
      }

      .home-card {
        min-height: 136px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface-soft);
        padding: 16px;
      }

      .home-card h3 {
        margin-bottom: 10px;
        font-size: 14px;
      }

      .home-card p,
      .home-card li {
        color: var(--ink-soft);
        font-size: 12px;
        line-height: 1.6;
      }

      .composer {
        margin: 0 34px 26px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        padding: 12px;
      }

      .composer-input {
        min-height: 56px;
        color: var(--ink-muted);
        font-size: 13px;
      }

      .artifact {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
      }

      .artifact-head {
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }

      .artifact-title-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 18px;
        padding: 16px 20px 10px;
      }

      .artifact-title {
        margin: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 18px;
        line-height: 1.35;
      }

      .artifact-path {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 7px;
        color: var(--ink-muted);
        font-size: 12px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        height: 24px;
        padding: 0 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface-soft);
        color: var(--ink-soft);
        font-size: 11px;
        font-weight: 700;
      }

      .artifact-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 20px 12px;
      }

      .switch {
        display: none;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--surface-soft);
      }

      .switch.visible {
        display: inline-flex;
      }

      .switch button {
        min-width: 72px;
        height: 28px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--ink-muted);
        cursor: pointer;
        font-size: 12px;
      }

      .switch button.active {
        background: var(--surface);
        color: var(--ink);
      }

      .meta-line {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--ink-muted);
        font-size: 12px;
      }

      .content {
        min-height: 0;
        overflow: auto;
      }

      .doc {
        max-width: 820px;
        margin: 0 auto;
        padding: 34px 48px 64px;
      }

      .doc h2 {
        margin-bottom: 16px;
        font-size: 24px;
        line-height: 1.25;
      }

      .doc h3 {
        margin: 28px 0 10px;
        font-size: 15px;
      }

      .doc p,
      .doc li {
        color: var(--ink-soft);
        font-size: 14px;
        line-height: 1.72;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin: 22px 0 24px;
      }

      .metric {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface-soft);
        padding: 12px;
      }

      .metric strong {
        display: block;
        font-size: 18px;
      }

      .metric span {
        color: var(--ink-muted);
        font-size: 11px;
      }

      .code {
        min-height: 100%;
        margin: 0;
        overflow: auto;
        padding: 24px;
        background: var(--code-bg);
        color: var(--code-ink);
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 13px;
        line-height: 1.72;
      }

      .line-no {
        display: inline-block;
        width: 32px;
        margin-right: 16px;
        color: var(--ink-muted);
        text-align: right;
        user-select: none;
      }

      .image-stage,
      .state-stage {
        height: 100%;
        display: grid;
        place-items: center;
        padding: 34px;
        background: var(--surface-base);
      }

      .mock-image {
        width: min(760px, 88%);
        aspect-ratio: 16 / 10;
        transform: scale(var(--zoom, 1));
        transform-origin: center;
        border: 1px solid rgba(255, 254, 250, 0.7);
        border-radius: 6px;
        background:
          linear-gradient(130deg, rgba(255, 254, 250, 0.18), transparent 34%),
          linear-gradient(120deg, #203642, #6b826a 45%, #d4b56f);
        box-shadow: 0 10px 24px rgba(17, 24, 39, 0.12);
        position: relative;
        overflow: hidden;
      }

      .mock-image::before {
        content: "";
        position: absolute;
        inset: 10%;
        border: 1px solid rgba(255, 254, 250, 0.42);
        background:
          linear-gradient(rgba(255, 254, 250, 0.18) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 254, 250, 0.18) 1px, transparent 1px);
        background-size: 38px 38px;
      }

      .mock-image::after {
        content: "Revenue bridge";
        position: absolute;
        left: 34px;
        bottom: 28px;
        color: rgba(255, 254, 250, 0.86);
        font-size: 26px;
        font-weight: 720;
      }

      .state-card {
        width: min(480px, 100%);
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        padding: 24px;
        box-shadow: var(--shadow);
      }

      .state-card h2 {
        margin-bottom: 8px;
        font-size: 15px;
      }

      .state-card p {
        color: var(--ink-soft);
        font-size: 13px;
        line-height: 1.65;
      }

      .right-panel {
        min-width: 0;
        display: flex;
        flex-direction: column;
        border-left: 1px solid var(--line);
        background: var(--surface-base);
      }

      .panel-tabs {
        display: flex;
        align-items: end;
        height: 48px;
        padding: 0 12px;
        background: var(--surface-base);
      }

      .panel-tab {
        height: 38px;
        border: 0;
        border-bottom: 2px solid transparent;
        background: transparent;
        color: var(--ink-soft);
        cursor: pointer;
        padding: 0 10px;
        font-size: 13px;
        font-weight: 600;
      }

      .panel-tab.active {
        border-color: var(--ink);
        color: var(--ink);
      }

      .panel-scroll {
        min-height: 0;
        flex: 1;
        overflow: auto;
        padding: 8px 10px 14px;
      }

      .section {
        margin-bottom: 8px;
        overflow: hidden;
        border: 1px solid #f3f4f6;
        border-radius: 12px;
        background: var(--surface-soft);
      }

      .section-head {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 40px;
        padding: 9px 12px;
        color: var(--ink);
        font-size: 13px;
        font-weight: 500;
      }

      .section-head span:last-child {
        margin-left: auto;
        color: var(--ink-muted);
        font-size: 12px;
      }

      .section-body {
        background: var(--surface);
        padding: 10px 12px;
      }

      .hint {
        color: var(--ink-soft);
        font-size: 12px;
        line-height: 1.55;
      }

      .root-row {
        display: flex;
        align-items: center;
        gap: 7px;
        height: 28px;
        color: var(--ink-soft);
        font-size: 12px;
      }

      .file-list {
        margin-top: 5px;
      }

      .folder {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        color: var(--ink-muted);
        font-size: 12px;
        font-weight: 500;
      }

      .file-row {
        width: 100%;
        display: grid;
        grid-template-columns: 18px minmax(0, 1fr);
        align-items: center;
        gap: 7px;
        min-height: 28px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        padding: 4px 7px 4px 20px;
        text-align: left;
      }

      .file-row:hover {
        background: var(--surface-muted);
      }

      .file-row.active {
        background: var(--surface-soft);
        color: var(--ink);
      }

      .file-icon {
        display: grid;
        width: 18px;
        height: 18px;
        place-items: center;
        border-radius: 5px;
        background: var(--surface-muted);
        color: var(--ink-soft);
        font-size: 9px;
        font-weight: 780;
      }

      .file-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
      }

      .toast {
        position: fixed;
        right: 382px;
        bottom: 22px;
        min-width: 260px;
        transform: translateY(22px);
        opacity: 0;
        pointer-events: none;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
        padding: 12px 14px;
        color: var(--ink-soft);
        font-size: 13px;
        transition:
          transform 160ms ease,
          opacity 160ms ease;
      }

      .toast.show {
        transform: translateY(0);
        opacity: 1;
      }

      @media (max-width: 1180px) {
        .app {
          grid-template-columns: 58px minmax(560px, 1fr) 330px;
          overflow-x: auto;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <aside class="rail" aria-label="App navigation">
        <div class="brand">V</div>
        <button class="rail-button active" title="项目">⌂</button>
        <button class="rail-button" title="对话">□</button>
        <button class="rail-button" title="技能">◇</button>
        <button class="rail-button" title="设置">⚙</button>
      </aside>

      <section class="main">
        <header class="topbar">
          <div class="crumb">项目 / <strong>AI infra research</strong></div>
          <div class="top-actions">
            <button class="text-button" id="showHome" type="button">项目主页</button>
            <button class="text-button" id="simulateLoading" type="button">模拟加载</button>
            <button class="text-button" id="simulateError" type="button">模拟错误</button>
          </div>
        </header>
        <div class="workspace" id="workspace"></div>
      </section>

      <aside class="right-panel" aria-label="Project context panel">
        <div class="panel-tabs">
          <button class="panel-tab active" type="button">项目</button>
          <button class="panel-tab" type="button">项目文件</button>
        </div>
        <div class="panel-scroll">
          <section class="section">
            <div class="section-head">▸ 待办事项 <span>0</span></div>
          </section>
          <section class="section">
            <div class="section-head">▾ 项目指令 <span></span></div>
            <div class="section-body">
              <p class="hint">关注 AI 基础设施产业链，输出需要保留数据来源和关键假设。</p>
            </div>
          </section>
          <section class="section">
            <div class="section-head">▾ Agent Team <span>3</span></div>
            <div class="section-body">
              <p class="hint">Lead analyst, Data scout, Report writer</p>
            </div>
          </section>
          <section class="section">
            <div class="section-head">▾ 项目文件 <span id="fileCount">6</span></div>
            <div class="section-body">
              <div class="root-row">▾ /Users/me/projects/ai-infra</div>
              <div class="file-list" id="fileTree"></div>
            </div>
          </section>
          <section class="section">
            <div class="section-head">▾ 知识库 <span>2</span></div>
            <div class="section-body">
              <p class="hint">Semiconductor notes, Cloud capex filings</p>
            </div>
          </section>
        </div>
      </aside>
    </main>
    <div class="toast" id="toast"></div>

    <script>
      const files = [
        { id: "report", folder: "reports", name: "market-structure-review.md", ext: "MD", size: "48 KB", modified: "今天 14:32", previewKind: "markdown", path: "reports/market-structure-review.md", title: "Market Structure Review" },
        { id: "brief", folder: "reports", name: "investment-brief.txt", ext: "TXT", size: "18 KB", modified: "今天 13:10", previewKind: "plain", path: "reports/investment-brief.txt", title: "Investment Brief" },
        { id: "code", folder: "src", name: "normalizeSignals.ts", ext: "TS", size: "6 KB", modified: "昨天 20:18", previewKind: "code", path: "src/analysis/normalizeSignals.ts", title: "normalizeSignals.ts" },
        { id: "image", folder: "assets", name: "revenue-bridge.png", ext: "PNG", size: "1.8 MB", modified: "昨天 18:44", previewKind: "image", path: "assets/charts/revenue-bridge.png", title: "Revenue Bridge" },
        { id: "pdf", folder: "sources", name: "supplier-channel-check.pdf", ext: "PDF", size: "7.4 MB", modified: "6 月 24 日", previewKind: "pdf", path: "sources/supplier-channel-check.pdf", title: "Supplier Channel Check" },
        { id: "unsupported", folder: "data", name: "consensus-model.xlsx", ext: "XLS", size: "2.4 MB", modified: "6 月 23 日", previewKind: "unsupported", path: "data/consensus-model.xlsx", title: "Consensus Model" },
      ];

      const folderOrder = ["reports", "src", "assets", "sources", "data"];
      let selectedId = null;
      let forcedState = null;
      let markdownMode = "rendered";
      let imageZoom = "1";

      const workspace = document.getElementById("workspace");
      const tree = document.getElementById("fileTree");
      const toast = document.getElementById("toast");

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 1700);
      }

      function escapeHtml(value) {
        return value.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function lineNumbers(text) {
        return text.trim().split("\n").map((line, index) => `<span class="line-no">${index + 1}</span>${escapeHtml(line)}`).join("\n");
      }

      function renderTree() {
        tree.innerHTML = folderOrder.map((folder) => {
          const children = files.filter((file) => file.folder === folder);
          if (!children.length) return "";
          return `<div class="folder">▾ ${folder}</div>${children.map((file) => `
            <button class="file-row ${file.id === selectedId ? "active" : ""}" type="button" data-file="${file.id}">
              <span class="file-icon">${file.ext}</span>
              <span class="file-name">${file.name}</span>
            </button>
          `).join("")}`;
        }).join("");
        tree.querySelectorAll(".file-row").forEach((button) => {
          button.addEventListener("click", () => {
            selectedId = button.dataset.file;
            forcedState = null;
            render();
          });
        });
      }

      function renderHome() {
        selectedId = null;
        forcedState = null;
        workspace.innerHTML = `
          <article class="project-home">
            <section class="home-hero">
              <div class="eyebrow">Project home</div>
              <h1>AI infra research</h1>
              <p>这是当前项目主页。右侧 context panel 继续承担上下文、项目文件、知识库和团队配置；点击右侧文件后，中间主区域切换为 artifact viewer。</p>
            </section>
            <section class="home-grid">
              <div class="home-card"><h3>最近对话</h3><p>Cloud capex update<br />Supplier channel check</p></div>
              <div class="home-card"><h3>进行中任务</h3><p>整理 Blackwell ramp 风险<br />提取管理层 guidance</p></div>
              <div class="home-card"><h3>项目产物</h3><p>报告、图表、数据文件会从右侧文件树进入统一 artifact 预览。</p></div>
            </section>
            <section class="composer">
              <div class="composer-input">向项目团队发消息，或从右侧文件树选择一个文件开始浏览...</div>
              <div class="row-actions"><button class="text-button">Chat</button><button class="text-button">Task</button></div>
            </section>
          </article>
        `;
        renderTree();
      }

      function renderArtifact(file) {
        workspace.innerHTML = `
          <article class="artifact" aria-live="polite">
            <header class="artifact-head">
              <div class="artifact-title-row">
                <div>
                  <h2 class="artifact-title">${file.title}</h2>
                  <div class="artifact-path"><span class="pill">${file.previewKind}</span><span>${file.path}</span></div>
                </div>
                <div class="artifact-actions">
                  <button class="icon-button" type="button" onclick="showToast('已复制 ${file.name}')">⧉</button>
                  <button class="icon-button" type="button" onclick="showToast('真实实现中外部打开')">↗</button>
                  <button class="icon-button" type="button" disabled>✎</button>
                </div>
              </div>
              <div class="artifact-toolbar">
                <div class="switch ${file.previewKind === "markdown" && !forcedState ? "visible" : ""}" id="modeSwitch">
                  <button class="${markdownMode === "rendered" ? "active" : ""}" data-mode="rendered" type="button">Rendered</button>
                  <button class="${markdownMode === "source" ? "active" : ""}" data-mode="source" type="button">Source</button>
                </div>
                <div class="switch ${file.previewKind === "image" && !forcedState ? "visible" : ""}" id="zoomSwitch">
                  <button class="${imageZoom === "0.82" ? "active" : ""}" data-zoom="0.82" type="button">Fit</button>
                  <button class="${imageZoom === "1" ? "active" : ""}" data-zoom="1" type="button">100%</button>
                  <button class="${imageZoom === "1.18" ? "active" : ""}" data-zoom="1.18" type="button">Zoom</button>
                </div>
                <div class="meta-line"><span>${file.size}</span><span>·</span><span>${file.modified}</span><span>·</span><span>${file.previewKind === "unsupported" ? "只可外部打开" : "只读预览"}</span></div>
              </div>
            </header>
            <div class="content" id="artifactContent"></div>
          </article>
        `;
        bindToolbar();
        renderArtifactContent(file);
      }

      function bindToolbar() {
        document.querySelectorAll("[data-mode]").forEach((button) => {
          button.addEventListener("click", () => {
            markdownMode = button.dataset.mode;
            render();
          });
        });
        document.querySelectorAll("[data-zoom]").forEach((button) => {
          button.addEventListener("click", () => {
            imageZoom = button.dataset.zoom;
            render();
          });
        });
      }

      function renderArtifactContent(file) {
        const target = document.getElementById("artifactContent");
        if (forcedState === "loading") {
          target.innerHTML = `<div class="state-stage"><div class="state-card"><h2>正在读取 artifact</h2><p>右侧文件树保持选中态，中间 viewer 显示内容请求状态。</p></div></div>`;
          return;
        }
        if (forcedState === "error") {
          target.innerHTML = `<div class="state-stage"><div class="state-card"><h2>无法预览这个文件</h2><p>文件可能被移动、过大，或被安全策略拦截。用户仍能复制路径或外部打开。</p><button class="text-button" onclick="forcedState=null;render()">重试</button></div></div>`;
          return;
        }
        if (file.previewKind === "markdown" && markdownMode === "source") {
          target.innerHTML = `<pre class="code">${lineNumbers(`# Market Structure Review

## Executive signal
AI infrastructure demand remains strong, but the bottleneck has moved from accelerator supply to power delivery, networking lead time, and datacenter permitting.

## Next action
Turn this file-backed Markdown preview into a structured document artifact once the renderer contract is stable.`)}</pre>`;
          return;
        }
        if (file.previewKind === "markdown") {
          target.innerHTML = `<section class="doc"><h2>Market Structure Review</h2><p>AI infrastructure demand remains strong, but the bottleneck has moved from accelerator supply to power delivery, networking lead time, and datacenter permitting.</p><div class="metric-grid"><div class="metric"><strong>+38%</strong><span>cloud capex guide</span></div><div class="metric"><strong>11 wk</strong><span>network lead time</span></div><div class="metric"><strong>72%</strong><span>agent confidence</span></div></div><h3>Key findings</h3><ul><li>Hyperscaler capex guidance is still expanding across training and inference clusters.</li><li>Rack-scale deployment timing is the main risk to near-term revenue recognition.</li><li>Margin pressure is visible in transition quarters but not thesis-breaking.</li></ul><h3>Next action</h3><p>后续可以把这个 renderer 换成 Tiptap structured document，而右侧文件树和主区域 shell 不需要重做。</p></section>`;
          return;
        }
        if (file.previewKind === "plain" || file.previewKind === "code") {
          const code = file.previewKind === "plain"
            ? `Research brief

Thesis:
Infrastructure spending is durable, but the best near-term signal is not GPU units. Watch power reservations, networking backlog, and customer prepayment terms.`
            : `type SignalInput = {
  channelChecks: number[];
  capexGuide: number;
  powerReservationMw: number;
};

export function normalizeSignals(input: SignalInput) {
  return {
    demandScore: Number((median(input.channelChecks) * 0.42).toFixed(2)),
    primaryConstraint: input.powerReservationMw > 180 ? "deployment" : "supply",
  };
}`;
          target.innerHTML = `<pre class="code">${lineNumbers(code)}</pre>`;
          return;
        }
        if (file.previewKind === "image") {
          target.innerHTML = `<div class="image-stage"><div class="mock-image" style="--zoom: ${imageZoom}"></div></div>`;
          return;
        }
        if (file.previewKind === "pdf") {
          target.innerHTML = `<div class="state-stage"><div class="state-card"><h2>PDF 预览占位</h2><p>M2 可替换为 PDF.js。当前重点是确认主区域 artifact shell 与右侧文件树的交互关系。</p></div></div>`;
          return;
        }
        target.innerHTML = `<div class="state-stage"><div class="state-card"><h2>当前类型暂不支持内嵌预览</h2><p>${file.name} 仍然作为 artifact 被选中，用户可以复制路径或外部打开。后续注册 xlsx renderer 即可补齐。</p><button class="text-button" onclick="showToast('已复制文件路径')">复制路径</button></div></div>`;
      }

      function render() {
        renderTree();
        if (!selectedId) {
          renderHome();
          return;
        }
        const file = files.find((candidate) => candidate.id === selectedId) || files[0];
        renderArtifact(file);
      }

      document.getElementById("showHome").addEventListener("click", renderHome);
      document.getElementById("simulateLoading").addEventListener("click", () => {
        if (!selectedId) selectedId = "report";
        forcedState = "loading";
        render();
      });
      document.getElementById("simulateError").addEventListener("click", () => {
        if (!selectedId) selectedId = "report";
        forcedState = "error";
        render();
      });

      renderHome();
    </script>
  </body>
</html>

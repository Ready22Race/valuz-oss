<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valuz 能力市场 · SkillHub 接入原型</title>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    :root {
      --bg: #f8f9fb;
      --surface: #ffffff;
      --surface-2: #f2f4f8;
      --line: #e7eaf0;
      --line-strong: #d9deea;
      --text: #181b23;
      --muted: #697181;
      --subtle: #969eaa;
      --brand: #725cf9;
      --brand-weak: #f0edff;
      --brand-line: #d9d1ff;
      --success: #168a52;
      --warning: #b96c00;
      --danger: #bf3a3a;
      --shadow: 0 16px 44px rgba(21, 25, 36, 0.08);
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      letter-spacing: 0;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 232px minmax(0, 1fr);
      min-height: 100vh;
      background: var(--bg);
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 18px 14px;
      border-right: 1px solid var(--line);
      background: #fbfcfe;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px 14px;
    }

    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 8px;
      color: white;
      background: var(--brand);
      font-weight: 750;
    }

    .brand-row strong {
      display: block;
      font-size: 15px;
      line-height: 1.2;
    }

    .brand-row span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .nav-group {
      display: grid;
      gap: 4px;
    }

    .nav-label {
      padding: 0 10px 6px;
      color: var(--subtle);
      font-size: 11px;
      font-weight: 650;
      text-transform: uppercase;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 38px;
      padding: 0 10px;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      text-align: left;
    }

    .nav-item svg {
      width: 17px;
      height: 17px;
      stroke-width: 2;
    }

    .nav-item.active {
      background: var(--brand-weak);
      color: var(--brand);
      font-weight: 700;
    }

    .workspace {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
      min-height: 100vh;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 64px;
      padding: 0 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(14px);
    }

    .crumb {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .crumb strong {
      color: var(--text);
      font-size: 14px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-button,
    .text-button,
    .primary-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 34px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .icon-button {
      width: 34px;
      background: var(--surface-2);
      color: var(--muted);
    }

    .text-button {
      padding: 0 12px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 650;
    }

    .primary-button {
      padding: 0 14px;
      background: var(--brand);
      color: white;
      font-size: 13px;
      font-weight: 700;
    }

    .icon-button svg,
    .text-button svg,
    .primary-button svg {
      width: 16px;
      height: 16px;
    }

    .market {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 0;
      padding: 22px 24px 24px;
      gap: 16px;
    }

    .market-head {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      gap: 18px;
      align-items: end;
    }

    .headline {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 760;
    }

    .headline p {
      margin: 7px 0 0;
      max-width: 760px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .quick-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .tabs-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-width: 0;
    }

    .segments {
      display: inline-flex;
      align-items: center;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: 0 1px 2px rgba(20, 24, 32, 0.03);
    }

    .segment {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 32px;
      padding: 0 12px;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .segment svg {
      width: 15px;
      height: 15px;
    }

    .segment.active {
      background: var(--brand);
      color: white;
    }

    .search-wrap {
      position: relative;
      width: min(360px, 38vw);
      min-width: 220px;
    }

    .search-wrap svg {
      position: absolute;
      top: 50%;
      left: 12px;
      width: 16px;
      height: 16px;
      transform: translateY(-50%);
      color: var(--subtle);
    }

    .search-wrap input {
      width: 100%;
      height: 38px;
      padding: 0 12px 0 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: 0;
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
    }

    .search-wrap input:focus {
      border-color: var(--brand-line);
      box-shadow: 0 0 0 3px rgba(114, 92, 249, 0.12);
    }

    .market-grid {
      display: grid;
      grid-template-columns: 236px minmax(360px, 1fr);
      gap: 14px;
      min-height: 0;
    }

    .panel {
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 1px 2px rgba(20, 24, 32, 0.03);
      overflow: hidden;
    }

    .category-rail {
      display: flex;
      flex-direction: column;
    }

    .rail-head,
    .catalog-head,
    .detail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 50px;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
    }

    .rail-head strong,
    .catalog-head strong,
    .detail-head strong {
      font-size: 13px;
    }

    .rail-list {
      display: grid;
      gap: 4px;
      padding: 10px;
      overflow: auto;
    }

    .category-btn {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 0 9px;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      text-align: left;
    }

    .category-btn svg {
      width: 16px;
      height: 16px;
    }

    .category-btn span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
    }

    .category-btn em {
      color: var(--subtle);
      font-size: 11px;
      font-style: normal;
    }

    .category-btn.active {
      background: var(--brand-weak);
      color: var(--brand);
      font-weight: 740;
    }

    .catalog-pane {
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr);
      min-height: 0;
    }

    .catalog-head {
      min-height: 54px;
    }

    .catalog-title {
      min-width: 0;
    }

    .catalog-title strong {
      display: block;
      font-size: 14px;
    }

    .catalog-title span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .subfilters {
      display: grid;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
    }

    .chip-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .chip-row::-webkit-scrollbar {
      display: none;
    }

    .filter-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }

    .filter-chip.active {
      border-color: var(--brand-line);
      background: var(--brand-weak);
      color: var(--brand);
    }

    .team-showcase {
      display: none;
      gap: 10px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      overflow: visible;
    }

    .team-showcase.visible {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    }

    .team-card {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      width: 100%;
      min-height: 128px;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfe;
      color: inherit;
      text-align: left;
      transition: border-color 0.14s ease, box-shadow 0.14s ease, transform 0.14s ease;
    }

    .team-card:hover {
      border-color: var(--line-strong);
      box-shadow: 0 8px 22px rgba(21, 25, 36, 0.06);
      transform: translateY(-1px);
    }

    .team-card .avatar {
      width: 34px;
      height: 34px;
    }

    .team-card .avatar svg {
      width: 17px;
      height: 17px;
    }

    .team-card strong {
      display: block;
      overflow: hidden;
      color: var(--text);
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
    }

    .team-card p {
      display: -webkit-box;
      margin: 4px 0 8px;
      overflow: hidden;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .cards {
      display: grid;
      gap: 10px;
      padding: 12px;
      overflow: auto;
      align-content: start;
    }

    .item-card {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      gap: 12px;
      width: 100%;
      min-height: 116px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: inherit;
      text-align: left;
      transition: border-color 0.14s ease, box-shadow 0.14s ease, transform 0.14s ease;
    }

    .item-card:hover {
      border-color: var(--line-strong);
      box-shadow: 0 8px 24px rgba(21, 25, 36, 0.07);
      transform: translateY(-1px);
    }

    .item-card.active {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(114, 92, 249, 0.12);
    }

    .avatar {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--brand);
    }

    .avatar svg {
      width: 20px;
      height: 20px;
    }

    .item-main {
      min-width: 0;
    }

    .item-topline {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .item-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 760;
    }

    .type-pill,
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 0 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 740;
      white-space: nowrap;
    }

    .type-pill {
      background: var(--brand-weak);
      color: var(--brand);
    }

    .badge {
      border: 1px solid var(--line);
      background: #fbfcfe;
      color: var(--muted);
    }

    .item-desc {
      display: -webkit-box;
      min-height: 38px;
      margin: 7px 0 9px;
      overflow: hidden;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.5;
    }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--subtle);
      font-size: 12px;
      flex-wrap: wrap;
    }

    .meta-row span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .meta-row svg {
      width: 13px;
      height: 13px;
    }

    .item-flags {
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      gap: 5px;
      flex-wrap: wrap;
      max-width: 140px;
    }

    .detail-body {
      padding: 16px;
      overflow: auto;
    }

    .detail-hero {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }

    .detail-hero .avatar {
      width: 48px;
      height: 48px;
    }

    .detail-hero h2 {
      margin: 0;
      font-size: 17px;
      line-height: 1.25;
    }

    .detail-hero p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .detail-desc {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 18px 0 8px;
      color: var(--text);
      font-size: 12px;
      font-weight: 780;
    }

    .section-title svg {
      width: 14px;
      height: 14px;
      color: var(--brand);
    }

    .role-list,
    .file-list,
    .risk-list {
      display: grid;
      gap: 8px;
    }

    .role-card,
    .file-card,
    .risk-card {
      display: grid;
      gap: 5px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfe;
    }

    .role-card strong,
    .risk-card strong {
      font-size: 12.5px;
    }

    .role-card p,
    .risk-card p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .file-card {
      grid-template-columns: 18px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .file-card code {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11.5px;
    }

    .tag-cloud {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 650;
    }

    .detail-footer {
      display: grid;
      gap: 8px;
      padding: 12px 14px;
      border-top: 1px solid var(--line);
      background: var(--surface);
    }

    .detail-footer .primary-button {
      width: 100%;
      min-height: 38px;
    }

    .footnote {
      color: var(--muted);
      font-size: 11.5px;
      line-height: 1.45;
      text-align: center;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: rgba(17, 20, 29, 0.38);
      backdrop-filter: blur(8px);
      z-index: 20;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .preview-modal {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      width: min(760px, calc(100vw - 48px));
      max-height: min(760px, calc(100vh - 48px));
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: 0 24px 80px rgba(13, 18, 30, 0.22);
      overflow: hidden;
    }

    .modal-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 54px;
      padding: 0 14px 0 18px;
      border-bottom: 1px solid var(--line);
    }

    .modal-title strong {
      font-size: 14px;
    }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      display: none;
      align-items: center;
      gap: 8px;
      max-width: 360px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
      color: var(--text);
      font-size: 13px;
      font-weight: 650;
      z-index: 10;
    }

    .toast.show {
      display: flex;
    }

    .toast svg {
      width: 17px;
      height: 17px;
      color: var(--success);
    }

    @media (max-width: 1180px) {
      .market-grid {
        grid-template-columns: 220px minmax(320px, 1fr);
      }
    }

    @media (max-width: 860px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }

      .market {
        padding: 16px;
      }

      .market-head,
      .tabs-row,
      .market-grid {
        grid-template-columns: 1fr;
      }

      .tabs-row {
        align-items: stretch;
      }

      .segments,
      .search-wrap {
        width: 100%;
      }

      .segment {
        flex: 1;
      }

      .category-rail {
        max-height: 220px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Valuz 主导航">
      <div class="brand-row">
        <div class="brand-mark">V</div>
        <div>
          <strong>Valuz</strong>
          <span>Agent workspace</span>
        </div>
      </div>

      <div class="nav-group">
        <div class="nav-label">Workspace</div>
        <button class="nav-item"><i data-lucide="message-square"></i><span>Chats</span></button>
        <button class="nav-item"><i data-lucide="folder"></i><span>Projects</span></button>
        <button class="nav-item"><i data-lucide="bot"></i><span>Agents</span></button>
        <button class="nav-item"><i data-lucide="zap"></i><span>Skills</span></button>
        <button class="nav-item active"><i data-lucide="layout-template"></i><span>能力市场</span></button>
      </div>

      <div class="nav-group">
        <div class="nav-label">System</div>
        <button class="nav-item"><i data-lucide="database"></i><span>Knowledge</span></button>
        <button class="nav-item"><i data-lucide="shield"></i><span>Security</span></button>
        <button class="nav-item"><i data-lucide="settings"></i><span>Settings</span></button>
      </div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div class="crumb">
          <span>Home</span>
          <i data-lucide="chevron-right"></i>
          <strong>能力市场</strong>
        </div>
        <div class="topbar-actions">
          <button class="icon-button" title="同步"><i data-lucide="refresh-cw"></i></button>
          <button class="icon-button" title="帮助"><i data-lucide="circle-help"></i></button>
        </div>
      </header>

      <section class="market" aria-label="能力市场">
        <div class="market-head">
          <div class="headline">
            <h1>能力市场</h1>
            <p>从官方模板和 SkillHub 导入 Agent、Agent Team 与 Skill。Skill 安装到 Skill 库，Agent 与 Agent Team 安装到 Agent 库，市场只负责发现、预览和导入。</p>
          </div>
          <div class="quick-actions">
            <button class="text-button" data-jump="agents"><i data-lucide="bot"></i>Agent 库导入</button>
            <button class="primary-button" data-jump="skills"><i data-lucide="zap"></i>Skill 库导入</button>
          </div>
        </div>

        <div class="tabs-row">
          <div class="segments" role="tablist" aria-label="市场模块">
            <button class="segment active" data-tab="agents" role="tab"><i data-lucide="bot"></i>Agents</button>
            <button class="segment" data-tab="skills" role="tab"><i data-lucide="zap"></i>Skills</button>
          </div>

      return catalog.filter((item) => {
        return item.module === state.tab;
      });

    function visibleItems() {
      const query = state.query.trim().toLowerCase();
      return tabItems().filter((item) => {
        const categoryOk = state.category === "all" || item.category === state.category;
        const subOk = state.subcategory === "all" || item.subcategories.includes(state.subcategory);
        const typeOk = state.tab !== "agents" || item.subtype === "agent";
        const text = [
          item.name,
          item.description,
          item.source,
          categoryName(item.category),
          ...item.subcategories.map(subName)
        ].join(" ").toLowerCase();
        const queryOk = !query || text.includes(query);
        return categoryOk && subOk && typeOk && queryOk;
      });
    }

    function visibleTeams() {
      if (state.tab !== "agents") return [];
      const query = state.query.trim().toLowerCase();
      return catalog.filter((item) => {
        const categoryOk = state.category === "all" || item.category === state.category;

          item.name,
          item.description,
          item.source,
          categoryName(item.category),
          ...item.subcategories.map(subName)
        ].join(" ").toLowerCase();
        const queryOk = !query || text.includes(query);
        return item.module === "agents" && item.subtype === "team" && categoryOk && subOk && queryOk;
      });

      if (!items.some((item) => item.id === state.selectedId)) {
        state.selectedId = items[0]?.id || tabItems()[0]?.id || catalog[0].id;

            ${icon(category.icon)}
            <span>${category.name}</span>
            <em>${count}</em>
          </button>
        `;
      }).join("");
      byId("categoryCount").textContent = state.category === "all" ? "全部" : categoryName(state.category);
    }

      const subcategories = [...new Set(tabItems()
        .filter((item) => state.category === "all" || item.category === state.category)

        ["all", "全部子分类"],
        ...subcategories.map((id) => [id, subName(id)])

        <button class="filter-chip ${state.subcategory === id ? "active" : ""}" data-subcategory="${id}">${label}</button>

      renderFilters();
      renderTeamShowcase();
      renderCards();
      renderDetail();
      if (window.lucide) window.lucide.createIcons();
    }

    function openPreview() {
      byId("previewModal").classList.add("open");
      byId("previewModal").setAttribute("aria-hidden", "false");
      renderDetail();
      if (window.lucide) window.lucide.createIcons();
    }

    function closePreview() {
      byId("previewModal").classList.remove("open");
      byId("previewModal").setAttribute("aria-hidden", "true");
    }

    function showToast(message) {
      byId("toastText").textContent = message;
      byId("toast").classList.add("show");
      if (window.lucide) window.lucide.createIcons();
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => byId("toast").classList.remove("show"), 2200);
    }

    document.addEventListener("click", (event) => {
      const tab = event.target.closest("[data-tab]");
      if (tab) {
        state.tab = tab.dataset.tab;
        state.category = "all";
        state.subcategory = "all";
        state.selectedId = tabItems()[0]?.id || catalog[0].id;
        render();
      }

      const jump = event.target.closest("[data-jump]");
      if (jump) {
        state.tab = jump.dataset.jump;
        state.category = "all";
        state.subcategory = "all";
        state.selectedId = tabItems()[0]?.id || catalog[0].id;
        render();
      }

      const category = event.target.closest("[data-category]");
      if (category) {
        state.category = category.dataset.category;
        state.subcategory = "all";
        render();
      }

      const subcategory = event.target.closest("[data-subcategory]");
      if (subcategory) {
        state.subcategory = subcategory.dataset.subcategory;
        render();
      }

      const item = event.target.closest("[data-item]");
      if (item) {
        state.selectedId = item.dataset.item;
        openPreview();
      }

      if (event.target.closest("#closePreview") || event.target.id === "previewModal") {
        closePreview();
      }
    });

    byId("searchInput").addEventListener("input", (event) => {
      state.query = event.target.value;
      render();
    });

    byId("installButton").addEventListener("click", () => {
      const item = catalog.find((candidate) => candidate.id === state.selectedId);
      showToast(`${item.name} 已加入${item.subtype === "skill" ? " Skill 库" : " Agent 库"}导入队列`);
      closePreview();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closePreview();
    });

    render();
  </script>
</body>
</html>

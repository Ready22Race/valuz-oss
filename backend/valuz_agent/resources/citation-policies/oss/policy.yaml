policy_id: oss-citation-baseline
layer: oss
version: citation-baseline-v2

activation:
  default_mode: required-on-evidence
  document_research_mode: required-on-evidence

source_tiers: []

rules:
  factual_claim:
    citation_required: true

semantics:
  # Cross-edition physical units belong to the citation protocol rather than
  # one industry overlay.  Canonical SI quantities let deterministic matching
  # verify localized answers against source-language documents without using
  # a model or guessing from the bare number alone.
  unit_ontology:
    revision: oss-si-units-v1
    units:
      watt:
        canonical: watt
        aliases: [W, watt, watts, 瓦]
        scale: 1
      kilowatt:
        canonical: watt
        aliases: [kW, kilowatt, kilowatts, 千瓦]
        scale: 1000
      megawatt:
        canonical: watt
        aliases: [MW, megawatt, megawatts, 兆瓦]
        scale: 1000000
      gigawatt:
        canonical: watt
        aliases: [GW, gigawatt, gigawatts, 吉瓦]
        scale: 1000000000
      terawatt:
        canonical: watt
        aliases: [TW, terawatt, terawatts, 太瓦]
        scale: 1000000000000

task_coverage:
  contract:
    requirement_kinds:
      - structured-slot
      - document-section
      - topic
      - comparison
      - calculation
      - output-shape
    dimensions: [entity, document, field, metric, period, as-of, count, order, output-format]
    selectors: [explicit]
    output_constraints: [prose, list, table, exact-count, required-columns, preserve-order]
    ontology_refs: []
  retrieval:
    # Runtime control, planning and artifact-delivery calls are observable
    # agent work, but they are not source retrieval.  The shared resolver
    # excludes them from Task Coverage without changing their UI visibility.
    ignored_tool_patterns:
      - "*list_skills*"
      - "*read_skill*"
      - "*write_todos*"
      - "*todo_update*"
      - "*automation*"
      - "*write_file*"
      - "*deliver_artifacts*"
      - "glob"
    ignored_input_patterns:
      - "*/.agents/skills/*"
      - "*/resources/skills/*"
      - "*/skills/*/SKILL.md*"
    identity_mappings:
      - id: oss-entity-identity
        tool_patterns: ["*entity*search*", "*identity*lookup*"]
        query_fields: [query, name, symbol, ticker, identifier]
        result_fields: [id, symbol, ticker, name, full_name, entity_name, aliases, synonyms]
    content_mappings:
      - id: oss-discovery-result
        role: candidate
        tool_patterns: ["*search*"]
      - id: oss-full-document-content
        role: content
        coverage_text: result
        coverage_scope: full-document
        tool_patterns: ["*document*raw*content*", "*document*fetch*", "*document*read*"]
      - id: oss-content-result
        role: content
        coverage_text: result
        coverage_scope: partial
        tool_patterns: ["*fetch*", "*read*", "*get*", "*query*", "*lookup*"]
    candidate_selection:
      - compatible-scope
      - required-parts-covered
      - locator-complete
      - inspect-beyond-first-partial-candidate
    source_constraints: [explicit-document-scope, same-entity, same-period]
  answer:
    structure_rules: [markdown-table, list-count, section-count, required-columns, preserve-order]
  remediation:
    allowed_actions:
      - re-inject
      - retrieve-and-patch
      - patch-answer
      - regenerate
      - report-unavailable
  observability:
    record:
      - task_contract
      - requirement_coverage
      - retrieval_attempts
      - model_input_manifest
      - answer_manifest
      - resolver_revision

failure:
  repair_attempts: 1
  publish_on_degraded: ready

observability:
  record:
    - status
    - issue_codes
    - policy_revision
  redact:
    - answer
    - quote
    - snippet
    - canonical_url

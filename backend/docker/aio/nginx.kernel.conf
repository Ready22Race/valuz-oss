# Routes the kernel under the AGS AIO sandbox's unified :8080 gateway at
# /kernel/. Dropped into /opt/gem/nginx/ where the base includes it into the
# gateway server block. The host reaches the kernel at
#   https://<sandbox-public-domain>/kernel/api/v1/...   and  /kernel/health
#
# VERIFY against the base (CI `inspect-aio-base`): whether files here are
# included at `server` level (then a `location` block, as written) or `http`
# level (then this must be wrapped in `server { ... }`). The kernel speaks
# JSON + WebSocket (/run) + SSE (event streams), so the upgrade headers and
# disabled buffering below are load-bearing — without them the run channel and
# live event streams break.
#
# Subpath note: the kernel's routes are absolute (/api/v1/*, /health) and it
# serves no root-relative static assets, so the /kernel/ prefix is safe (no
# SPA-style 404s). proxy_pass keeps the trailing slash so /kernel/ is stripped
# before the kernel sees /api/v1/... .
location /kernel/ {
    proxy_pass http://127.0.0.1:8000/;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;          # WS /run
    proxy_set_header Connection $connection_upgrade; # WS /run
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;                             # SSE: flush immediately
    proxy_cache off;
    proxy_read_timeout 3600s;                        # long-lived WS + SSE
    proxy_send_timeout 3600s;
}

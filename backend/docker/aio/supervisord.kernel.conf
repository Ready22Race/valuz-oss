; Valuz kernel as a Tencent AGS AIO-sandbox custom service. Dropped into
; /opt/tiger/run/supervisord/ where the base's supervisord includes it and
; starts it alongside the built-in AIO services.
;
; VERIFY against the base: the include dir and whether program names must be
; unique are confirmed by the CI `inspect-aio-base` step. Loopback + unauth is
; the default (the gateway fronts auth); set KERNEL_AUTH_TOKEN here for
; defence-in-depth.
[program:valuz-kernel]
command=/app/kernel-run.sh
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=5
stopwaitsecs=15
stopsignal=TERM
stdout_logfile=/var/log/valuz-kernel.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/valuz-kernel.err.log
stderr_logfile_maxbytes=10MB
; Loopback-unauth: the kernel's standalone guard permits unauthenticated
; serving only on a loopback bind, which is exactly our topology (gateway in
; front). Provider keys (OPENAI_API_KEY/ANTHROPIC_API_KEY) and the host
; callback URL are inherited from the container env injected by AGS.
environment=HOST="127.0.0.1",KERNEL_ALLOW_UNAUTHENTICATED="1",KERNEL_PORT="8000"

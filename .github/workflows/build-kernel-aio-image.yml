name: Build Kernel AIO Image (Tencent AGS)

# Builds the KERNEL layered onto the Tencent AGS **all-in-one sandbox** base
# (ccr.ccs.tencentyun.com/ags-image/sandbox-aio). The kernel runs INSIDE the AIO
# base as a supervisord custom service, fronted by the base's :8080 nginx
# gateway at /kernel/ — see backend/docker/aio/Dockerfile.
#
# The AIO base lives on Tencent CCR (private). To PULL it (and to PUSH the
# result) the job needs CCR credentials as repo secrets:
#   CCR_REGISTRY   (default: ccr.ccs.tencentyun.com)
#   CCR_USERNAME
#   CCR_PASSWORD
# Without them the job can still validate the Dockerfile against a public
# `base_image` override (e.g. ghcr.io/agent-infra/sandbox:latest), but cannot
# pull the real AGS base or push to CCR. Pushing to TCR can also be done
# manually — see scripts/build-kernel-image.sh (VARIANT=aio).

on:
  workflow_dispatch:
    inputs:
      base_image:
        description: "AIO base to build FROM (the 基础镜像依赖)."
        required: false
        default: "ccr.ccs.tencentyun.com/ags-image/sandbox-aio:latest"
        type: string
      target_image:
        description: "Output image repo (no tag)."
        required: false
        default: "ccr.ccs.tencentyun.com/xiaobang/valuz-kernel"
        type: string
      tag:
        description: "Image tag (default: short commit SHA)."
        required: false
        default: ""
        type: string
      push:
        description: "Push to CCR (needs CCR_* secrets). Off = build-only."
        required: false
        default: false
        type: boolean
      also_latest:
        description: "Also tag :latest."
        required: false
        default: true
        type: boolean

concurrency:
  group: build-kernel-aio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build kernel AIO image (FROM AGS sandbox-aio)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CCR_REGISTRY: ${{ secrets.CCR_REGISTRY }}
      CCR_USERNAME: ${{ secrets.CCR_USERNAME }}
      CCR_PASSWORD: ${{ secrets.CCR_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Detect CCR credentials
        id: creds
        run: |
          if [ -n "${CCR_PASSWORD}" ] && [ -n "${CCR_USERNAME}" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "▸ no CCR_* secrets: cannot pull the private AGS base or push to CCR."
            echo "  Override base_image to a public mirror to validate the Dockerfile,"
            echo "  or add CCR_USERNAME/CCR_PASSWORD (+ optional CCR_REGISTRY) secrets."
          fi

      - name: Log in to Tencent CCR
        if: steps.creds.outputs.has == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CCR_REGISTRY != '' && env.CCR_REGISTRY || 'ccr.ccs.tencentyun.com' }}
          username: ${{ env.CCR_USERNAME }}
          password: ${{ env.CCR_PASSWORD }}

      # ── Resolve image ref + tags ──────────────────────────────────────────
      - name: Resolve refs
        id: ref
        run: |
          image="${{ inputs.target_image }}"
          tag="${{ inputs.tag }}"
          [ -z "$tag" ] && tag="$(git rev-parse --short HEAD)"
          tags="${image}:${tag}"
          if [ "${{ inputs.also_latest }}" = "true" ]; then
            tags="${tags}
          ${image}:latest"
          fi
          {
            echo "image=${image}"
            echo "tag=${tag}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "▸ base : ${{ inputs.base_image }}"
          echo "▸ image: ${image}:${tag} (latest=${{ inputs.also_latest }}, push=${{ inputs.push }})"

      # ── Introspect the AIO base: the coexist contract assumes these include
      #    dirs exist. Fail loud if the base's layout differs. ────────────────
      - name: Inspect AIO base (verify coexist dirs)
        run: |
          set -e
          docker pull "${{ inputs.base_image }}"
          echo "▸ checking supervisord + nginx include dirs on the base"
          docker run --rm --entrypoint sh "${{ inputs.base_image }}" -c '
            miss=0
            for d in /opt/tiger/run/supervisord /opt/gem/nginx; do
              if [ -d "$d" ]; then echo "  ok  $d"; else echo "  MISSING  $d"; miss=1; fi
            done
            exit $miss
          ' || {
            echo "::error::AIO base does not expose the expected supervisord/nginx include dirs."
            echo "Update backend/docker/aio/{supervisord,nginx}.kernel.conf drop paths to match this base."
            exit 1
          }

      - name: Build kernel AIO image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/docker/aio/Dockerfile
          platforms: linux/amd64
          push: ${{ inputs.push && steps.creds.outputs.has == 'true' }}
          load: ${{ !(inputs.push && steps.creds.outputs.has == 'true') }}
          tags: ${{ steps.ref.outputs.tags }}
          build-args: |
            BASE_IMAGE=${{ inputs.base_image }}
            UV_DEFAULT_INDEX=${{ secrets.UV_DEFAULT_INDEX }}
          cache-from: type=gha,scope=aio
          cache-to: type=gha,mode=max,scope=aio

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### Kernel AIO image"
            echo "- base:  \`${{ inputs.base_image }}\`"
            echo "- image: \`${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.tag }}\`"
            echo "- pushed: ${{ inputs.push && steps.creds.outputs.has == 'true' }}"
            if [ "${{ steps.creds.outputs.has }}" != "true" ]; then
              echo ""
              echo "> No CCR_* secrets — private AGS base could not be pulled/pushed."
              echo "> Add CCR_USERNAME / CCR_PASSWORD (+ optional CCR_REGISTRY) or push to TCR manually."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

name: Build Kernel AIO Image (Tencent AGS)

# Builds the KERNEL layered onto the Tencent AGS **all-in-one sandbox** base
# (ccr.ccs.tencentyun.com/ags-image/sandbox-aio, an s6-overlay image). The kernel
# runs INSIDE the AIO base as an s6-overlay service on :8000; AGS port-maps it to
# https://8000-<instance>.<domain> so no gateway route is needed — see
# backend/docker/aio/Dockerfile.
#
# The AGS AIO base is PUBLIC (no creds to pull). By default the built image is
# pushed to **ghcr.io** with the automatic GITHUB_TOKEN — then pull it from ghcr
# and re-push to Tencent CCR manually (docker tag + push, or
# scripts/build-kernel-image.sh VARIANT=aio). If you point target_image at a
# ccr.ccs.tencentyun.com repo instead, add CCR_USERNAME / CCR_PASSWORD
# (+ optional CCR_REGISTRY) secrets and it will log in + push there directly.

on:
  workflow_dispatch:
    inputs:
      base_image:
        description: "AIO base to build FROM (the 基础镜像依赖)."
        required: false
        default: "ccr.ccs.tencentyun.com/ags-image/sandbox-aio:latest"
        type: string
      target_image:
        description: "Output image repo, no tag. Empty = ghcr.io/<owner>/valuz-kernel-aio."
        required: false
        default: ""
        type: string
      tag:
        description: "Image tag (default: short commit SHA)."
        required: false
        default: ""
        type: string
      push:
        description: "Push the image (ghcr uses GITHUB_TOKEN; ccr needs CCR_* secrets)."
        required: false
        default: true
        type: boolean
      also_latest:
        description: "Also tag :latest."
        required: false
        default: true
        type: boolean

concurrency:
  group: build-kernel-aio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build kernel AIO image (FROM AGS sandbox-aio)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      CCR_REGISTRY: ${{ secrets.CCR_REGISTRY }}
      CCR_USERNAME: ${{ secrets.CCR_USERNAME }}
      CCR_PASSWORD: ${{ secrets.CCR_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # ── Resolve image ref + tags + which registry to log into ─────────────
      - name: Resolve refs
        id: ref
        run: |
          image="${{ inputs.target_image }}"
          if [ -z "$image" ]; then
            owner_lc="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
            image="ghcr.io/${owner_lc}/valuz-kernel-aio"
          fi
          registry="${image%%/*}"
          tag="${{ inputs.tag }}"
          [ -z "$tag" ] && tag="$(git rev-parse --short HEAD)"
          tags="${image}:${tag}"
          if [ "${{ inputs.also_latest }}" = "true" ]; then
            tags="${tags}
          ${image}:latest"
          fi
          {
            echo "image=${image}"
            echo "registry=${registry}"
            echo "tag=${tag}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "▸ base : ${{ inputs.base_image }}"
          echo "▸ image: ${image}:${tag}  (registry=${registry}, latest=${{ inputs.also_latest }}, push=${{ inputs.push }})"

      - name: Log in to GHCR
        if: ${{ inputs.push && steps.ref.outputs.registry == 'ghcr.io' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Tencent CCR
        if: ${{ inputs.push && steps.ref.outputs.registry != 'ghcr.io' && env.CCR_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CCR_REGISTRY != '' && env.CCR_REGISTRY || 'ccr.ccs.tencentyun.com' }}
          username: ${{ env.CCR_USERNAME }}
          password: ${{ env.CCR_PASSWORD }}

      # ── Introspect the AIO base: we add the kernel as an s6-overlay service,
      #    so the base must be s6-overlay (PID1 /init) with the s6-rc.d service
      #    dir + the `user` bundle we register into. Fail loud otherwise. ──────
      - name: Inspect AIO base (verify s6-overlay layout)
        run: |
          set -e
          docker pull "${{ inputs.base_image }}"
          echo "▸ checking s6-overlay service dirs on the base"
          docker run --rm --entrypoint sh "${{ inputs.base_image }}" -c '
            miss=0
            [ -x /init ] || { echo "  MISSING  /init (s6-overlay entrypoint)"; miss=1; }
            for d in /etc/s6-overlay/s6-rc.d /etc/s6-overlay/s6-rc.d/user/contents.d; do
              if [ -d "$d" ]; then echo "  ok  $d"; else echo "  MISSING  $d"; miss=1; fi
            done
            exit $miss
          ' || {
            echo "::error::AIO base is not the expected s6-overlay layout - rework backend/docker/aio for this base init system."
            exit 1
          }

      - name: Build & push kernel AIO image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/docker/aio/Dockerfile
          platforms: linux/amd64
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          tags: ${{ steps.ref.outputs.tags }}
          build-args: |
            BASE_IMAGE=${{ inputs.base_image }}
            UV_DEFAULT_INDEX=${{ secrets.UV_DEFAULT_INDEX }}
          cache-from: type=gha,scope=aio
          cache-to: type=gha,mode=max,scope=aio

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### Kernel AIO image"
            echo "- base:  \`${{ inputs.base_image }}\`"
            echo "- image: \`${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.tag }}\`"
            echo "- pushed: ${{ inputs.push }} (registry: ${{ steps.ref.outputs.registry }})"
            if [ "${{ steps.ref.outputs.registry }}" = "ghcr.io" ]; then
              echo ""
              echo "Then push to Tencent CCR manually:"
              echo '```'
              echo "docker pull ${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.tag }}"
              echo "docker tag  ${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.tag }} ccr.ccs.tencentyun.com/xiaobang/valuz-kernel:${{ steps.ref.outputs.tag }}"
              echo "docker push ccr.ccs.tencentyun.com/xiaobang/valuz-kernel:${{ steps.ref.outputs.tag }}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

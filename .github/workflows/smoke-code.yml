name: Smoke code image
on:
  workflow_dispatch:
    inputs:
      image:
        default: "ghcr.io/ready22race/valuz-kernel-code:bdd93b1"
        type: string
jobs:
  s:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: run + verify non-root + health
        run: |
          IMG="${{ inputs.image }}"
          docker pull "$IMG"
          docker run -d --name k -p 8000:8000 -e KERNEL_AUTH_TOKEN=devtoken "$IMG"
          ok=0
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/health 2>/dev/null || true)
            [ "$code" = "200" ] && { ok=1; echo "KERNEL READY ~$((i*2))s"; break; }
            sleep 2
          done
          echo "===== who runs uvicorn / kernel? (expect uid 1000 user) ====="
          docker exec k sh -c 'ps -eo user,uid,pid,comm,args 2>/dev/null | grep -E "uvicorn|python|envd" | grep -v grep | head -20'
          echo "===== id of user 1000 ====="
          docker exec k sh -c 'id user 2>/dev/null; getent passwd 1000'
          echo "===== envd listening on 49983? ====="
          docker exec k sh -c '(ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | grep -E ":8000|:49983" | head'
          echo "===== kernel service log ====="
          docker logs k 2>&1 | grep -aE "valuz-kernel|migrating|serving|Application startup|Started server|Permission|denied|Error" | head -20
          docker rm -f k >/dev/null 2>&1 || true
          test "$ok" = 1

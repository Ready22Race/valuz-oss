name: Build Kernel Lean Image

# Builds the lean AGS kernel image (python-slim + kernel + e2b envd + self-
# installed s6-overlay) — AGS login (envd:49983) + kernel (:8000), non-root,
# without the ~4.7GB sandbox-code base. See backend/docker/lean/Dockerfile.
#
# Pushes to ghcr.io by default (GITHUB_TOKEN). envd is extracted at build time
# from ENVD_SRC_IMAGE (the AGS base, public). Then pull from ghcr and re-push to
# Tencent CCR manually.

on:
  workflow_dispatch:
    inputs:
      envd_src_image:
        description: "Image to extract /usr/bin/envd from (build-time only)."
        required: false
        default: "ccr.ccs.tencentyun.com/ags-image/sandbox-code:v1.2"
        type: string
      target_image:
        description: "Output repo, no tag. Empty = ghcr.io/<owner>/valuz-kernel-lean."
        required: false
        default: ""
        type: string
      tag:
        description: "Image tag (default: short commit SHA)."
        required: false
        default: ""
        type: string
      push:
        description: "Push to ghcr.io."
        required: false
        default: true
        type: boolean
      also_latest:
        required: false
        default: true
        type: boolean

concurrency:
  group: build-kernel-lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build lean kernel image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Resolve refs
        id: ref
        run: |
          image="${{ inputs.target_image }}"
          if [ -z "$image" ]; then
            owner_lc="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
            image="ghcr.io/${owner_lc}/valuz-kernel-lean"
          fi
          tag="${{ inputs.tag }}"
          [ -z "$tag" ] && tag="$(git rev-parse --short HEAD)"
          tags="${image}:${tag}"
          if [ "${{ inputs.also_latest }}" = "true" ]; then
            tags="${tags}
          ${image}:latest"
          fi
          {
            echo "image=${image}"; echo "tag=${tag}"
            echo "tags<<EOF"; echo "${tags}"; echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "▸ envd src: ${{ inputs.envd_src_image }}"
          echo "▸ image: ${image}:${tag} (push=${{ inputs.push }})"

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/docker/lean/Dockerfile
          platforms: linux/amd64
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          tags: ${{ steps.ref.outputs.tags }}
          build-args: |
            ENVD_SRC_IMAGE=${{ inputs.envd_src_image }}
            UV_DEFAULT_INDEX=${{ secrets.UV_DEFAULT_INDEX }}
          cache-from: type=gha,scope=lean
          cache-to: type=gha,mode=max,scope=lean

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### Lean kernel image"
            echo "- image: \`${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.tag }}\`"
            echo "- envd from: \`${{ inputs.envd_src_image }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

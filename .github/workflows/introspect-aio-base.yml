name: Introspect AIO base
on:
  workflow_dispatch:
    inputs:
      base_image:
        description: "AIO base to introspect"
        required: false
        default: "ccr.ccs.tencentyun.com/ags-image/sandbox-aio:latest"
        type: string
jobs:
  introspect:
    runs-on: ubuntu-latest
    steps:
      - name: s6 service structure + gateway
        run: |
          IMG="${{ inputs.base_image }}"
          docker pull "$IMG" >/dev/null
          echo "===== s6-rc.d services ====="
          docker run --rm --entrypoint sh "$IMG" -c 'ls -1 /etc/s6-overlay/s6-rc.d/ 2>/dev/null; echo "--- user bundle contents.d ---"; ls -1 /etc/s6-overlay/s6-rc.d/user/contents.d/ 2>/dev/null'
          echo "===== example longrun service (pick one that serves http) ====="
          docker run --rm --entrypoint sh "$IMG" -c '
            for s in envtool jupyter uvicorn api server vscode; do
              d=/etc/s6-overlay/s6-rc.d/$s
              [ -d "$d" ] || continue
              echo "### service: $s ###"
              echo "-- type --"; cat "$d/type" 2>/dev/null
              echo "-- run --"; cat "$d/run" 2>/dev/null | head -40
              echo "-- dependencies.d --"; ls "$d/dependencies.d" 2>/dev/null
              echo
            done'
          echo "===== cont-init.d (oneshot init scripts) ====="
          docker run --rm --entrypoint sh "$IMG" -c 'ls -1 /etc/s6-overlay/s6-rc.d/*/type 2>/dev/null | head; echo "--- any /etc/cont-init.d ---"; ls -la /etc/cont-init.d 2>/dev/null'
          echo "===== nginx gateway server (sites-enabled/default) ====="
          docker run --rm --entrypoint sh "$IMG" -c 'echo "## sites-enabled/default ##"; cat /etc/nginx/sites-enabled/default 2>/dev/null | head -80; echo "## conf.d ##"; ls -la /etc/nginx/conf.d/ 2>/dev/null; for f in /etc/nginx/conf.d/*.conf; do echo "### $f"; cat "$f"; done 2>/dev/null | head -60'
          echo "===== /init + AGS custom hooks ====="
          docker run --rm --entrypoint sh "$IMG" -c 'echo "## /init ##"; cat /init 2>/dev/null; echo "## any custom-service hook dirs ##"; ls -la /etc/s6-overlay/scripts /custom* /opt/custom* /app 2>/dev/null'

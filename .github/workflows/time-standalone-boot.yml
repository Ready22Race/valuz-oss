name: Time standalone kernel boot
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "branch/sha to build the standalone image from"
        default: "ci/kernel-image"
        type: string
jobs:
  timeit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Build standalone image
        run: docker build -f backend/docker/kernel.Dockerfile -t std ./backend
      - name: Run + time phases
        run: |
          docker run -d --name kboot -p 8000:8000 -e KERNEL_AUTH_TOKEN=devtoken std
          start=$(date +%s%3N)
          ready="TIMEOUT"
          for i in $(seq 1 300); do
            code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/health 2>/dev/null || true)
            if [ "$code" = "200" ]; then
              ready=$(( $(date +%s%3N) - start ))
              break
            fi
            sleep 0.2
          done
          echo "=================================================="
          echo "container-start -> /health 200 : ${ready} ms"
          echo "=================================================="
          echo "----- timestamped boot log (docker logs -t) -----"
          docker logs -t kboot 2>&1 | grep -aE "migrating|upgrade|serving|Started server|Application startup|Uvicorn|FATAL" | head -40
          docker rm -f kboot >/dev/null 2>&1 || true

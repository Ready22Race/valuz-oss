name: Smoke lean image
on:
  workflow_dispatch:
    inputs:
      image:
        default: "ghcr.io/ready22race/valuz-kernel-lean:3ab36e2"
        type: string
jobs:
  s:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: run + verify
        run: |
          IMG="${{ inputs.image }}"
          docker pull "$IMG"
          echo "image size:"; docker image inspect "$IMG" --format 'size={{.Size}}'
          docker run -d --name ksmoke -p 8000:8000 -p 49983:49983 -e KERNEL_AUTH_TOKEN=devtoken "$IMG"
          ok=0
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/health 2>/dev/null || true)
            [ "$code" = "200" ] && { ok=1; echo "KERNEL READY ~$((i*2))s"; break; }
            sleep 2
          done
          echo "===== processes (uid comm) — expect envd(0) + python(1000) ====="
          docker exec ksmoke sh -c 'for d in /proc/[0-9]*; do u=$(awk "/^Uid:/{print \$2}" "$d/status" 2>/dev/null); c=$(cat "$d/comm" 2>/dev/null); [ -n "$c" ] && echo "$u $c"; done | grep -E "envd|python|uvicorn|s6-svscan" | sort -u' || true
          echo "===== envd on :49983 responding? ====="
          curl -s -o /dev/null -w 'envd :49983 -> http %{http_code}\n' localhost:49983 || echo "no response"
          echo "===== boot log ====="
          docker logs ksmoke 2>&1 | grep -aE "valuz-kernel|migrating|serving|Application startup|s6-rc|envd|Error|denied" | head -20 || true
          docker rm -f ksmoke >/dev/null 2>&1 || true
          test "$ok" = 1

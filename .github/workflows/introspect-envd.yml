name: Introspect envd
on:
  workflow_dispatch:
    inputs:
      base_image:
        default: "ccr.ccs.tencentyun.com/ags-image/sandbox-code:v1.2"
        type: string
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - name: dump envd
        run: |
          IMG="${{ inputs.base_image }}"
          docker pull "$IMG" >/dev/null
          echo "===== envd binary ====="
          docker run --rm --entrypoint sh "$IMG" -c 'ls -la /usr/bin/envd; file /usr/bin/envd 2>/dev/null || echo "(no file cmd)"; echo "size:"; wc -c < /usr/bin/envd'
          echo "===== ldd (shared lib deps) ====="
          docker run --rm --entrypoint sh "$IMG" -c 'ldd /usr/bin/envd 2>&1 || echo "static or no ldd"'
          echo "===== envd --help / version ====="
          docker run --rm --entrypoint sh "$IMG" -c '/usr/bin/envd --help 2>&1 | head -30 || /usr/bin/envd version 2>&1 | head -5 || echo "no help"'
          echo "===== envd config / companion files (strings for paths) ====="
          docker run --rm --entrypoint sh "$IMG" -c 'strings /usr/bin/envd 2>/dev/null | grep -aE "^/(etc|usr|var|opt|run)/|envd|\.sock|:499|:80|config" | sort -u | head -40'
          echo "===== other AGS bins in /usr/bin (ttyd/companions) ====="
          docker run --rm --entrypoint sh "$IMG" -c 'ls -la /usr/bin/ | grep -aiE "envd|ttyd|ags|sandbox|e2b|gotty" '
          echo "===== /etc envd config ====="
          docker run --rm --entrypoint sh "$IMG" -c 'find /etc /opt -iname "*envd*" 2>/dev/null | head; ls -la /etc/envd 2>/dev/null'

name: Build Kernel Image

# Builds + verifies the agent-harness KERNEL container image. Build-only:
# CI does NOT push to any registry — it proves the image builds on linux and
# boots/serves. Pushing to a registry (ghcr / Volcengine CR) is a separate
# manual step (scripts/build-kernel-image.sh) once you're ready to deploy.
#
# Two targets (different cloud sandboxes need different images):
#   - vefaas:     FROM the AIO Sandbox base (Volcengine veFaaS). Kernel runs as
#                 a supervisord custom service behind the AIO :8080 gateway.
#   - standalone: FROM python-slim. Self-contained kernel; smoke-tested on :8000.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which image to build"
        required: false
        default: "vefaas"
        type: choice
        options:
          - vefaas
          - standalone
      aio_base:
        description: "veFaaS only: AIO base to build FROM. ghcr and the Volcengine vefaas-public image are the SAME image at a given version (upstream publishes both at the same tag); ghcr pulls faster on GitHub runners. Pinned, not :latest. Override to the volc mirror at the same version if you prefer."
        required: false
        default: "ghcr.io/agent-infra/sandbox:1.0.0.150"
        type: string

concurrency:
  group: build-kernel-image-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  build:
    name: Build kernel image (${{ inputs.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # ── Ground-truth the AIO base before trusting our supervisord/nginx
      #    wiring (we're otherwise blind to its include conventions). Pure
      #    diagnostic — never fails the build. ───────────────────────────────
      - name: Inspect AIO base
        if: ${{ inputs.target == 'vefaas' }}
        continue-on-error: true
        run: |
          BASE="${{ inputs.aio_base }}"
          echo "::group::pull ${BASE}"
          docker pull "$BASE"
          echo "::endgroup::"
          {
            echo "### AIO base introspection (\`${BASE}\`)"
            echo ""
            echo "#### image config (entrypoint / cmd / ports)"
            echo '```'
            docker inspect "$BASE" --format 'Entrypoint={{json .Config.Entrypoint}}
          Cmd={{json .Config.Cmd}}
          Exposed={{json .Config.ExposedPorts}}
          WorkingDir={{.Config.WorkingDir}}
          User={{.Config.User}}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          run() { docker run --rm --entrypoint sh "$BASE" -c "$1" 2>&1 || true; }
          {
            echo "#### python"
            echo '```'; run 'for p in python3 python3.12 python3.11 python3.10; do command -v $p && $p --version; done'; echo '```'
            echo "#### supervisord layout"
            echo '```'
            run 'ls -la /opt/tiger/run/supervisord/ 2>/dev/null; echo ---; find / -name "supervisord.conf" 2>/dev/null | head; echo ---; for f in $(find / -name "supervisord.conf" 2>/dev/null | head -2); do echo "== $f =="; grep -iE "include|files=" "$f"; done'
            echo '```'
            echo "#### nginx layout (include level + connection_upgrade map?)"
            echo '```'
            run 'ls -la /opt/gem/nginx/ 2>/dev/null; echo ---; (nginx -T 2>/dev/null || cat /opt/gem/nginx/*.conf 2>/dev/null) | grep -inE "include|listen |server \{|location |map .*http_upgrade|connection_upgrade" | head -50'
            echo '```'
            echo "#### file root / workspace"
            echo '```'; run 'ls -la /workspace /home /root 2>/dev/null | head -40'; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve dockerfile
        id: cfg
        run: |
          if [ "${{ inputs.target }}" = "vefaas" ]; then
            echo "dockerfile=docker/vefaas/Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "dockerfile=docker/kernel.Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      # ── Build (load into the runner's docker — no push). ─────────────────
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/${{ steps.cfg.outputs.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: valuz-kernel:verify
          build-args: |
            BASE_IMAGE=${{ inputs.aio_base }}
            UV_DEFAULT_INDEX=${{ secrets.UV_DEFAULT_INDEX }}
          cache-from: type=gha,scope=${{ inputs.target }}
          cache-to: type=gha,mode=max,scope=${{ inputs.target }}

      # ── Standalone smoke: boot + /health + auth gate. ────────────────────
      - name: Smoke test standalone
        if: ${{ inputs.target == 'standalone' }}
        run: |
          set -e
          docker run --rm --entrypoint sh valuz-kernel:verify -c '
            SDK=$(python -c "import claude_agent_sdk,os;print(os.path.dirname(claude_agent_sdk.__file__))")
            ls -la "$SDK/_bundled/" || (echo "MISSING bundled claude" && exit 1)
            command -v codex && codex --version || echo "codex: ABSENT (expected per linux override)"'
          docker run -d --name ksmoke -p 8000:8000 -e KERNEL_AUTH_TOKEN=devtoken valuz-kernel:verify
          ok=0; for _ in $(seq 1 45); do curl -fs localhost:8000/health >/dev/null 2>&1 && { ok=1; break; }; sleep 2; done
          docker logs ksmoke | tail -30; test "$ok" = 1
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/v1/sessions)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer devtoken' localhost:8000/api/v1/sessions)" = 200
          docker rm -f ksmoke; echo "✓ standalone image boots + serves + auth-gates"

      # ── veFaaS smoke: deps present + AIO boot + reach kernel via :8080
      #    gateway. Best-effort (the AIO base boots many services and our
      #    supervisord/nginx wiring may need a pass against introspection). ──
      - name: Smoke test vefaas (best-effort)
        if: ${{ inputs.target == 'vefaas' }}
        continue-on-error: true
        run: |
          set -x
          docker run --rm --entrypoint sh valuz-kernel:verify -c '
            PYTHONPATH=/app/kernel /app/.venv/bin/python -c "import app.main" && echo "app.main import OK"
            SDK=$(/app/.venv/bin/python -c "import claude_agent_sdk,os;print(os.path.dirname(claude_agent_sdk.__file__))")
            ls -la "$SDK/_bundled/"
            ls -la /opt/tiger/run/supervisord/valuz-kernel.conf /opt/gem/nginx/valuz-kernel.conf'
          # Boot the AIO sandbox (inherits its supervisord init) and reach the
          # kernel through the :8080 gateway. (Container names must be >=2 chars.)
          docker rm -f vsmoke 2>/dev/null || true
          docker run -d --name vsmoke --security-opt seccomp=unconfined -p 8080:8080 valuz-kernel:verify
          for _ in $(seq 1 60); do curl -fs localhost:8080/v1/sandbox/health >/dev/null 2>&1 && break; sleep 2; done
          echo "--- AIO health ---";    curl -s localhost:8080/v1/sandbox/health || true; echo
          echo "--- kernel health ---"; curl -s localhost:8080/kernel/health || true; echo
          docker exec vsmoke sh -c 'tail -40 /var/log/valuz-kernel*.log 2>/dev/null' || true
          docker exec vsmoke sh -c 'supervisorctl status 2>/dev/null || /opt/tiger/**/supervisorctl status 2>/dev/null' || true
          docker logs vsmoke | tail -60 || true
          docker rm -f vsmoke || true

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### Build (${{ inputs.target }}) — build-only, no push"
            echo "- dockerfile: \`${{ steps.cfg.outputs.dockerfile }}\`"
            echo "- image built + loaded as \`valuz-kernel:verify\` (discarded at job end)"
          } >> "$GITHUB_STEP_SUMMARY"

name: Introspect sandbox-code base
on:
  workflow_dispatch:
    inputs:
      base_image:
        default: "ccr.ccs.tencentyun.com/ags-image/sandbox-code:v1.2"
        type: string
jobs:
  introspect:
    runs-on: ubuntu-latest
    steps:
      - name: Pull + dump
        run: |
          IMG="${{ inputs.base_image }}"
          docker pull "$IMG"
          echo "===== CONFIG ====="
          docker inspect "$IMG" --format '{{json .Config}}' | python3 -c 'import sys,json;c=json.load(sys.stdin);print("Entrypoint:",c.get("Entrypoint"));print("Cmd:",c.get("Cmd"));print("ExposedPorts:",list((c.get("ExposedPorts") or {}).keys()));print("Env-ports:",[e for e in (c.get("Env") or []) if "PORT" in e])'
          echo "===== OS + size ====="
          docker run --rm --entrypoint sh "$IMG" -c 'cat /etc/os-release 2>/dev/null | head -2; uname -m'
          docker image inspect "$IMG" --format 'size={{.Size}}'
          echo "===== INIT SYSTEM ====="
          docker run --rm --entrypoint sh "$IMG" -c '
            [ -x /init ] && echo "has /init"
            for b in supervisord s6-svscan tini dumb-init; do command -v $b >/dev/null 2>&1 && echo "has $b"; done
            echo "-- s6 --"; ls -d /etc/s6-overlay/s6-rc.d /etc/s6-overlay/s6-rc.d/user/contents.d 2>/dev/null
            echo "-- s6 services --"; ls /etc/s6-overlay/s6-rc.d/ 2>/dev/null | tr "\n" " "; echo
            echo "-- user bundle --"; ls /etc/s6-overlay/s6-rc.d/user/contents.d/ 2>/dev/null | tr "\n" " "; echo
            echo "-- supervisord dirs --"; ls -d /opt/tiger/run/supervisord /etc/supervisor* /opt/gem/nginx 2>/dev/null
          '
          echo "===== port 8000 free? ====="
          docker run --rm --entrypoint sh "$IMG" -c 'grep -rsl 8000 /etc/nginx /etc/s6-overlay 2>/dev/null | head; echo done'
